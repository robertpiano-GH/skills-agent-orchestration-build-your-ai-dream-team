<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard" aria-labelledby="dashboard-title">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Team project overview</p>
          <h1 id="dashboard-title">Project Pulse</h1>
          <p class="dashboard-description">Track active work, recent activity, and priority across live initiatives.</p>
        </div>
        <div class="dashboard-summary" aria-live="polite">
          <strong>Project count:</strong>
          <span id="project-count">0</span>
        </div>
      </header>

      <section id="project-list" class="project-list" aria-label="Project cards"></section>
    </main>

    <script>
      async function loadProjects() {
        try {
          const response = await fetch('project-data.json');
          const data = await response.json();
          const list = document.getElementById('project-list');
          const count = document.getElementById('project-count');

          if (!data.projects || !Array.isArray(data.projects)) {
            list.innerHTML = '<p class="error-message">Project data is unavailable.</p>';
            return;
          }

          count.textContent = data.projects.length;
          list.innerHTML = data.projects.map(project => `
            <article class="project-card" aria-labelledby="${project.name.replace(/\s+/g, '-')}-title">
              <div class="card-header">
                <h2 id="${project.name.replace(/\s+/g, '-')}-title">${project.name}</h2>
                <span class="project-priority">${project.priority}</span>
              </div>
              <dl class="project-meta">
                <div>
                  <dt>Owner</dt>
                  <dd>${project.owner}</dd>
                </div>
                <div>
                  <dt>Status</dt>
                  <dd>${project.status}</dd>
                </div>
                <div>
                  <dt>Recent activity</dt>
                  <dd>${project.recentActivity}</dd>
                </div>
              </dl>
            </article>
          `).join('');
        } catch (error) {
          document.getElementById('project-list').innerHTML = '<p class="error-message">Unable to load project data.</p>';
          console.error(error);
        }
      }

      loadProjects();
    </script>
  </body>
</html>
